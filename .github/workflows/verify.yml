name: Verify software
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/npc-eitn-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/check_package.py
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/run_demo.py --output "$RUNNER_TEMP/npc_eitn_demo"

  publish-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: synthetic-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Create verified version package
        run: |
          python scripts/build_release.py --output "$RUNNER_TEMP/NPC_EITN_code_v0.2.3.zip"
          cd "$RUNNER_TEMP"
          sha256sum NPC_EITN_code_v0.2.3.zip > SHA256SUMS
      - name: Publish version without replacing an existing release
        run: |
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo "Version v0.2.3 already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create v0.2.3 "$RUNNER_TEMP/NPC_EITN_code_v0.2.3.zip" "$RUNNER_TEMP/SHA256SUMS" --target "$GITHUB_SHA" --title "NPC EITN v0.2.3" --notes "Registered-image EITN, association and four-model prediction code with pinned dependencies, synthetic examples and aggregate reference results. Sealed inventory, 25 tests and the synthetic workflow passed before publication. No participant-level records, images or fitted clinical models are distributed. Reuse terms remain in LICENSE_STATUS.md; no DOI is assigned."
      - name: Retain current version checks
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate > "$RUNNER_TEMP/prior-checks.json"
          python - <<'PYCODE' > "$RUNNER_TEMP/prior-check-ids.txt"
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/prior-checks.json') as stream:
              records = json.load(stream)
          for run in records['workflow_runs']:
              if run['head_sha'] != os.environ['GITHUB_SHA'] and run['event'] == 'push' and run['status'] == 'completed':
                  print(run['id'])
          PYCODE
          while IFS= read -r run_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done < "$RUNNER_TEMP/prior-check-ids.txt"
