[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "npc-eitn-reproducibility"
version = "0.2.3"
description = "Current NPC EITN phenotype, associations and four-model prediction code"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.4.6", "pandas==2.3.3", "scipy==1.17.1", "scikit-learn==1.8.0", "lifelines==0.30.3", "joblib>=1.4,<2", "scikit-image>=0.25,<0.27", "nibabel>=5,<6", "matplotlib>=3.10,<3.12"]
[tool.setuptools.packages.find]
where = ["src"]
